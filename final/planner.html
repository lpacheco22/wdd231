<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Trip | Ecuador Nature Explorer | Luis Pacheco</title>
    <meta name="description"
        content="Create your Ecuador nature adventure plan by selecting destinations, travel dates, and trip information.">
    <meta name="author" content="Luis Pacheco">
    <link rel="icon" href="images/favicon.ico">
    <meta property="og:title" content="Plan Your Ecuador Nature Adventure">
    <meta property="og:description"
        content="Create a personalized Ecuador nature adventure by selecting destinations, travel dates, and trip information.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lpacheco22.github.io/wdd231/final/images/hero.webp">
    <meta property="og:url" content="https://lpacheco22.github.io/wdd231/final/planner.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/dates.js" defer></script>
    <script src="scripts/planner.js" defer></script>

</head>

<body>

    <header>

        <div class="logo">
            <img src="images/logo.webp" alt="Ecuador Nature Explorer logo" width="60" height="60">
            <span>
                Ecuador Nature Explorer
            </span>
        </div>

        <button id="menu" aria-label="Navigation Menu">
            ☰
        </button>

        <nav>
            <ul class="navigation">
                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>
                <li>
                    <a href="explore.html">
                        Explore
                    </a>
                </li>
                <li>
                    <a href="planner.html" class="active" aria-current="page">
                        Plan Your Trip
                    </a>
                </li>
            </ul>
        </nav>

    </header>

    <main>
        <h1>
            Plan Your Ecuador Adventure
        </h1>
        <section>
            <h2>
                Create Your Trip Plan
            </h2>
            <p>
                Complete the form below and create your personalized
                nature exploration plan.
            </p>
            <form action="thankyou.html" method="get">

                <label for="name">
                    Full Name
                </label>

                <input type="text" id="name" name="name" required>

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" required>

                <label for="destination">
                    Favorite Destination
                </label>

                <select id="destination" name="destination" required>

                    <option value="">
                        Choose a destination
                    </option>

                    <option value="Cotopaxi National Park">
                        Cotopaxi National Park
                    </option>

                    <option value="Galapagos National Park">
                        Galapagos National Park
                    </option>

                    <option value="Yasuni National Park">
                        Yasuni National Park
                    </option>

                    <option value="Mindo Cloud Forest">
                        Mindo Cloud Forest
                    </option>

                    <option value="Cajas National Park">
                        Cajas National Park
                    </option>

                </select>

                <label for="month">
                    Preferred Travel Month
                </label>
                <input type="month" id="month" name="month" required>
                <label for="travelers">
                    Number of Travelers
                </label>
                <input type="number" id="travelers" name="travelers" min="1" max="20" required>
                <label for="comments">
                    Additional Comments
                </label>
                <textarea id="comments" name="comments" rows="5"></textarea>
                <button type="submit">
                    Submit Plan
                </button>

            </form>

        </section>

    </main>

    <footer>

        <div class="social">
            <a href="https://github.com/lpacheco22/wdd231" target="_blank" rel="noopener" aria-label="GitHub">
                <img src="images/github.svg" alt="GitHub" width="40" height="40">
            </a>

            <a href="https://www.linkedin.com/in/luis-pacheco-varas/" target="_blank" rel="noopener"
                aria-label="LinkedIn">
                <img src="images/linkedin.svg" alt="LinkedIn" width="40" height="40">
            </a>

        </div>

        <p>
            ©
            <span id="currentYear"></span>
            Ecuador Nature Explorer | Luis Pacheco
        </p>

        <p id="lastModified"></p>

        <p>
            <a href="planner.html">
                Final Project
            </a>
        </p>

    </footer>

</body>

</html>
